name: Build My Local Patched Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout My Pre-Patched Code
      uses: actions/checkout@v4

    - name: Set up Environment Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex libelf-dev libssl-dev libxml2-utils lz4 unzip git texinfo

    - name: Set up SUSFS Source Elements
      run: |
        git clone -b kernel-4.14 --depth=1 https://gitlab.com/simonpunk/SUSFS4KSU.git susfs
        # Manually copy over the structured files directly into the tree
        cp -r susfs/kernel_patches/fs/* ./fs/ || true
        cp -r susfs/kernel_patches/include/linux/* ./include/linux/ || true
        
    - name: Inject SUSFS Config Configurations
      run: |
        # Ensure the SUSFS configuration flag is cleanly appended to the configuration layout
        echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/miatoll_defconfig

    - name: Compile Kernel Binary
      run: |
        git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git gcc
        export PATH=$(pwd)/gcc/bin:$PATH
        make O=out arch/arm64/configs/miatoll_defconfig
        make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-elf-

    - name: Upload Flashable Output
      uses: actions/upload-artifact@v4
      with:
        name: Miatoll-SUSFS-Kernel
        path: out/arch/arm64/boot/Image.gz-dtb
